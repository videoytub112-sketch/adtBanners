<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adtBanner — Рекламная Сеть</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0b0f19; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; }
        
        /* Шапка adtBanner */
        .logo-container { margin: 30px 0 10px; text-align: center; }
        .logo-main { font-size: 32px; font-weight: 800; color: #ffffff; letter-spacing: -1px; }
        .logo-accent { color: #00ff88; text-shadow: 0 0 15px rgba(0,255,136,0.4); }
        .subtitle { color: #5f6c85; margin-bottom: 40px; font-size: 14px; text-align: center; max-width: 380px; line-height: 1.6; }
        
        /* Зоны для баннеров Linkslot */
        .ads-wrapper { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 30px; }
        
        .ads-slot { 
            width: 100%; 
            background: #131a26; 
            padding: 20px; 
            border-radius: 16px; 
            border: 2px dashed #222f47; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 110px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .ads-slot:hover { border-color: #00ff88; transform: translateY(-2px); }
        
        .slot-title { font-size: 11px; color: #475569; margin-bottom: 12px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; }
        
        /* Заглушка до покупки */
        .linkslot-placeholder { color: #38bdf8; font-size: 14px; text-align: center; text-decoration: none; font-weight: 500; background: rgba(56, 189, 248, 0.06); padding: 12px 24px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.15); }
    </style>
</head>
<body>

    <!-- Название платформы -->
    <div class="logo-container">
        <div class="logo-main"><span class="logo-accent">adt</span>Banner</div>
    </div>
    <p class="subtitle">Платформа автоматического размещения баннеров. Разместите свои материалы моментально с гарантией показов.</p>

    <div class="ads-wrapper">

        <!-- СЛОТ №1: ВЕРХНИЙ БАННЕР (РАБОЧИЙ) -->
        <div class="ads-slot">
            <div class="slot-title">adtBanner Slot #1 (468x60)</div>
            <!-- === ЗДЕСЬ СТОИТ ТВОЙ РЕАЛЬНЫЙ КОД ИЗ LINKSLOT === -->
            <div id="slot_370019"><script src="https://linkslot.ru/bancode_new.php?id=370019" async></script></div>
            <!-- ============================================ -->
        </div>

        <!-- СЛОТ №2: ЦЕНТРАЛЬНЫЙ БАННЕР (РЕЗЕРВ) -->
        <div class="ads-slot" style="min-height: 310px;">
            <div class="slot-title">adtBanner Slot #2 (300x250)</div>
            <!-- === СЮДА ВСТАВИШЬ КОД ДЛЯ ВТОРОГО БЛОКА === -->
            <div class="linkslot-placeholder">Разместить баннер через Linkslot</div>
            <!-- ============================================ -->
        </div>

        <!-- СЛОТ №3: НИЖНИЙ БАННЕР (РЕЗЕРВ) -->
        <div class="ads-slot">
            <div class="slot-title">adtBanner Slot #3 (468x60)</div>
            <!-- === СЮДА ВСТАВИШЬ КОД ДЛЯ ТРЕТЬЕГО БЛОКА === -->
            <div class="linkslot-placeholder">Разместить баннер через Linkslot</div>
            <!-- ============================================ -->
        </div>

    </div>

</body>
</html>
