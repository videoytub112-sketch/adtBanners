    <script>
        // Массив секторов колеса (по порядку против часовой стрелки для точного расчета)
        const prizes = ["10 ₽", "10 000 ₽", "5 000 ₽", "2 500 ₽", "1 000 ₽", "500 ₽", "100 ₽", "50 ₽"];
        
        let isSpinning = false;
        let forcedWin = localStorage.getItem('forced_win') || "-1";

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            const wheel = document.getElementById('wheel');
            let targetSector;

            // Карта перевода индексов из админки в реальные сектора колеса
            const selectorToPrizeIndex = {
                0: 0, // 10 р -> 10 р
                1: 7, // 50 р -> 50 р
                2: 6, // 100 р -> 100 р
                3: 5, // 500 р -> 500 р
                4: 4, // 1000 р -> 1000 р
                5: 3, // 2500 р -> 2500 р
                6: 2, // 5000 р -> 5000 р
                7: 1  // 10000 р -> 10000 р
            };

            // Если в админке выбрана подкрутка
            if (forcedWin !== "-1") {
                targetSector = selectorToPrizeIndex[parseInt(forcedWin)];
            } else {
                // Иначе выбираем абсолютно случайно
                targetSector = Math.floor(Math.random() * 8);
            }

            // Расчет угла вращения (каждый сектор по 45 градусов)
            const sectorDegrees = 45;
            const targetDegrees = 1800 + (targetSector * sectorDegrees) + 22.5; 

            // Запускаем вращение через CSS
            wheel.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)';
            wheel.style.transform = `rotate(${targetDegrees}deg)`;

            setTimeout(() => {
                // Выводим результат выигрыша
                document.getElementById('winText').innerText = `Вы выиграли ${prizes[targetSector]}!`;
                document.getElementById('winPopup').style.display = 'block';
            }, 4000); 
        }

        function closePopup() {
            document.getElementById('winPopup').style.display = 'none';
            document.getElementById('wheel').style.transition = 'none';
            document.getElementById('wheel').style.transform = 'rotate(0deg)';
            setTimeout(() => {
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            }, 50);
        }

        // Функции скрытой мобильной админки
        function openAdmin() {
            if (prompt("Введите пароль:") !== "112233") return alert("Неверно!");
            document.getElementById('adminModal').style.display = 'block';
            document.getElementById('forcedResult').value = forcedWin;
        }
        
        function closeAdmin() { 
            document.getElementById('adminModal').style.display = 'none'; 
        }
        
        function saveAdminSettings() {
            forcedWin = document.getElementById('forcedResult').value;
            localStorage.setItem('forced_win', forcedWin);
            closeAdmin();
            alert("Настройки успешно применены!");
        }
        
        // Первичный запуск сайта
        renderSite();
        
        // Заглушка, чтобы старый код отрисовки не выдавал ошибок
        function renderSite() {}
    </script>
